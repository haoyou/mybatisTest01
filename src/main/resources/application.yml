spring:
  # springfox 3 依赖 AntPathMatcher；Boot 2.6 默认的 PathPatternParser 会让 Swagger 文档里的接口全部为空
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://192.168.152.128:3306/mybatis_test01?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    # 账号密码来自环境变量：DB_USER 缺省 root，DB_PASSWORD 必须显式提供（缺失则启动即失败，避免用空密码连库）
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

#mybatis:
#  mapper-locations: classpath:mappers/*.xml
#  #目的是为了省略resultType里的代码量
##  type-aliases-package: com.chf.pojo
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
mybatis:
  configuration: # 配置打印 MyBatis⽇志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 自定义jwt key
jwt:
  tokenHeader: Authorization #JWT存储的请求头
  # 签名密钥来自环境变量 JWT_SECRET；必须显式提供，缺失则启动失败。
  # 注意：更换该值会让已签发的 token 全部失效。
  secret: ${JWT_SECRET}
  expiration: 604800 #JWT的超限时间(60*60*24)
  tokenHead: Bearer  #JWT负载中拿到开头
